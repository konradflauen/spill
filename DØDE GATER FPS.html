{const gt=tex('#2b2d2a',g=>{for(let i=0;i<500;i++){g.fillStyle='rgba('+(i%3?'0,0,0':'255,255,255')+',.06)';g.fillRect(Math.random()*128,Math.random()*128,1+Math.random()*5,1+Math.random()*5)}
g.strokeStyle='rgba(0,0,0,.35)';for(let i=0;i<5;i++){g.beginPath();let x=Math.random()*128,y=Math.random()*128;g.moveTo(x,y);for(let j=0;j<5;j++){x+=Math.random()*30-15;y+=Math.random()*30-15;g.lineTo(x,y)}g.stroke()}},20);

g.strokeStyle='rgba(60,40,90,.5)';g.lineWidth=1;for(let i=0;i<16;i++){g.beginPath();let x=rnd()*128,y=rnd()*128;g.moveTo(x,y);for(let j=0;j<5;j++){x+=rnd()*20-10;y+=rnd()*20-10;g.lineTo(x,y)}g.stroke()}
